<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Workbus cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; inset: 0; width: 960px; height: 288px; }
  .ink { fill: var(--text); } .brand { fill: var(--brand); } .agent { fill: var(--agent); } .steel { fill: var(--line-control); }
  .band { rx: var(--radius-sm); }
  .route { stroke: var(--text); stroke-width: 6; fill: none; }
  .stop { stroke: var(--text); stroke-width: 6; }
  .stop.on-agent { fill: var(--agent); } .stop.on-brand { fill: var(--brand); } .stop.on-steel { fill: var(--line-control); }
  .now { fill: var(--brand); stroke: var(--bg); stroke-width: 6; }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { font-family: var(--font-sans); font-weight: 620; font-size: 100px; line-height: .92; letter-spacing: -0.035em; color: var(--text); margin: 0; }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--muted); margin: 14px 0 0 4px; }
</style></head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: text 456x64, agent 312x40, brand 384x64, line-control 240x40; the colors people know Workbus by (ink, vermilion, agent teal) plus one steel neutral
      arrangement: four log lines stacked flush right and bleeding off the right edge, newest on top, staggered lengths like entries in a log; gaps space-2 (8px), top inset space-10 (40px)
      pattern: literal motif, the Route mark: one vertical line with stops through every line and a vermilion now-stop on the newest. Chosen because the mark is a bus route over the log, which is what the README says Workbus is
      steps and radii: heights 64 = 2 x space-8 and 40 = space-10, x offsets on a 24px grid, band corners radius-sm, stops r 12 and now r 20
    -->
    <rect class="ink band" x="528" y="40" width="456" height="64"/>
    <rect class="agent band" x="672" y="112" width="312" height="40"/>
    <rect class="brand band" x="600" y="160" width="384" height="64"/>
    <rect class="steel band" x="744" y="232" width="240" height="40"/>
    <path class="route" d="M816 72V252"/>
    <circle class="stop on-steel" cx="816" cy="252" r="12"/>
    <circle class="stop on-brand" cx="816" cy="192" r="12"/>
    <circle class="stop on-agent" cx="816" cy="132" r="12"/>
    <circle class="now" cx="816" cy="72" r="20"/>
  </svg>
  <div class="text">
    <h1 class="name">Workbus</h1>
    <p class="tag">One log for an org of people and agents.</p>
  </div>
</div>
</body>
</html>
