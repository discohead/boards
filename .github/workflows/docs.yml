# Builds the docs site (apps/docs), with its link check, on every pull request and push to main.
# The site is served at https://docs.workbus.dev by the workbus-docs Worker: pnpm --filter ./apps/docs run deploy.
name: docs

on:
  pull_request:
    paths:
      - apps/docs/**
      - packages/workbus/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/workbus/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter ./apps/docs
      - name: Build (with the link check)
        run: pnpm --filter ./apps/docs build
